<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>AGENDA INTELIGENTE</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">

<style>
/* ---------------------------------------------------
   PALETA BRANCO + DOURADO (LUXO)
--------------------------------------------------- */
:root{
  --bg:#f8f8f8;
  --card:#ffffff;
  --text:#1f1f1f;
  --muted:#7b7b7b;
  --line:#e3e3e3;

  --gold:#d4a437;
  --gold-dark:#b88714;
  --gold-light:#f7e8c3;

  --radius:18px;
  --shadow:0 12px 28px rgba(0,0,0,.08);
  --glass: rgba(255,255,255,.45);
}

/* ---------------------------------------------------
   BASE
--------------------------------------------------- */

*{box-sizing:border-box;font-family:'Inter',sans-serif;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;

  background:
    radial-gradient(900px 600px at -5% -10%, rgba(212,164,55,.10), transparent 70%),
    radial-gradient(900px 700px at 110% -10%, rgba(255,215,160,.12), transparent 70%),
    var(--bg);
}

.wrap{
  max-width:1250px;
  margin:auto;
  padding:26px 18px 40px;
}

header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:22px;
}

.title{
  font-size:clamp(1.4rem,3vw,2rem);
  font-weight:900;
  letter-spacing:.3px;
  color:var(--gold-dark);
  display:flex;
  align-items:center;
  gap:12px;
}

.badge{
  padding:6px 12px;
  border-radius:999px;
  font-size:.82rem;
  font-weight:700;
  background:linear-gradient(90deg,var(--gold),var(--gold-dark));
  color:#fff;
  box-shadow:var(--shadow);
}

/* ---------------------------------------------------
   LOGIN / CADASTRO
--------------------------------------------------- */

#authBox{
  max-width:420px;
  margin:60px auto;
  background:var(--card);
  padding:28px;
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  animation:fadeIn .4s ease;
}

#authTabs{
  display:flex;
  margin-bottom:20px;
}

.auth-tab{
  flex:1;
  text-align:center;
  padding:12px 0;
  border-bottom:3px solid transparent;
  font-weight:700;
  color:var(--muted);
  cursor:pointer;
  transition:.2s;
}

.auth-tab.active{
  color:var(--gold-dark);
  border-color:var(--gold);
}

.auth-input{
  width:100%;
  padding:12px;
  margin-bottom:14px;
  border-radius:var(--radius);
  border:1px solid var(--line);
  font-size:15px;
  outline:none;
  transition:.15s;
}

.auth-input:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(212,164,55,.25);
}

.btn-auth{
  width:100%;
  padding:12px;
  font-size:16px;
  font-weight:700;
  border:none;
  border-radius:var(--radius);
  cursor:pointer;
  color:#fff;
  background:linear-gradient(90deg,var(--gold),var(--gold-dark));
  box-shadow:var(--shadow);
}

/* ---------------------------------------------------
   FORMULÁRIO / CARDS
--------------------------------------------------- */

.card{
  background:var(--card);
  border-radius:var(--radius);
  border:1px solid var(--line);
  box-shadow:var(--shadow);
  overflow:hidden;
  animation:fadeIn .5s ease;
}

.card-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:18px;
  background:var(--glass);
  border-bottom:1px solid var(--line);
}

.section{padding:20px;}
.section + .section{border-top:1px dashed var(--line);}
h3{margin:0 0 12px;color:var(--gold-dark);font-weight:800;}

input, select, textarea{
  width:100%;
  padding:12px;
  border:1px solid var(--line);
  border-radius:var(--radius);
  outline:none;
  font-size:15px;
  transition:.15s;
}

input:focus, select:focus, textarea:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(212,164,55,.25);
}

.inline-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.inline-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}

@media(max-width:760px){
  .inline-grid,.inline-3{grid-template-columns:1fr;}
}

.btn{
  padding:12px;border:none;cursor:pointer;
  font-weight:700;border-radius:var(--radius);
}
.btn-primary{
  background:linear-gradient(90deg,var(--gold),var(--gold-dark));
  color:#fff;
}
.btn-ghost{
  background:transparent;
  border:1px dashed var(--line);
  color:var(--muted);
}

/* ---------------------------------------------------
   CALENDÁRIO
--------------------------------------------------- */

.cal{padding:16px;}
.cal-title{color:var(--gold-dark);font-size:1.15rem;font-weight:800;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
.cal-dow{text-align:center;color:var(--muted);font-size:.85rem;}

.cal-day{
  min-height:110px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:10px;
  cursor:pointer;
  position:relative;
  transition:.15s;
}

.cal-day:hover{
  transform:translateY(-2px);
  box-shadow:var(--shadow);
}

.tags{
  position:absolute;bottom:10px;left:10px;right:10px;
  display:flex;flex-wrap:wrap;gap:4px;
}

.tag{
  padding:4px 6px;
  border-radius:999px;
  font-size:.75rem;
  background:var(--glass);
  border:1px solid var(--line);
}

/* ---------------------------------------------------
   MODAIS
--------------------------------------------------- */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:90;
}
.modal.show{display:flex;}

.sheet{
  background:var(--card);
  width:100%;
  max-width:540px;
  max-height:85vh;
  overflow:auto;
  border-radius:20px 20px 0 0;
  box-shadow:0 -10px 30px rgba(0,0,0,.25);
}

.res-item{
  background:var(--glass);
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px;
  margin-bottom:10px;
}

.name{font-weight:700;color:var(--gold-dark);}

/* Toast */
.toast{
  position:fixed;
  right:16px;
  bottom:16px;
  background:#333;
  color:#fff;
  padding:12px 14px;
  border-radius:12px;
  display:none;
}
.toast.show{display:block;}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(10px);}
  to{opacity:1;transform:translateY(0);}
}
</style>
</head>

<body>

<!-- ---------------------------------------------------
     LOGIN / CADASTRO
--------------------------------------------------- -->
<div id="authBox">
  <div id="authTabs">
    <div class="auth-tab active" id="tabLogin">Entrar</div>
    <div class="auth-tab" id="tabCadastro">Cadastrar</div>
  </div>

  <div id="loginForm">
    <input type="text" id="loginUsuario" class="auth-input" placeholder="Usuário">
    <input type="password" id="loginSenha" class="auth-input" placeholder="Senha">
    <button class="btn-auth" id="btnLogin">Entrar</button>
  </div>

  <div id="cadastroForm" style="display:none;">
    <input type="text" id="cadNome" class="auth-input" placeholder="Nome completo">
    <input type="email" id="cadEmail" class="auth-input" placeholder="E-mail">
    <input type="text" id="cadUsuario" class="auth-input" placeholder="Usuário desejado">
    <input type="password" id="cadSenha" class="auth-input" placeholder="Senha">
    <button class="btn-auth" id="btnCadastrar">Criar Usuário</button>
  </div>
</div>

<!-- ---------------------------------------------------
     APLICATIVO
--------------------------------------------------- -->
<div id="app" style="display:none;">
  <div class="wrap">
    <header>
      <div class="title">AGENDA INTELIGENTE</div>
      <div class="badge">Painel Oficial</div>
    </header>

    <form id="reservaForm" class="card">
      <div class="card-head">
        <h2>Nova Reserva</h2>
      </div>

      <input type="hidden" name="acao" value="cadastrar">
      <input type="hidden" name="codigoAba" id="codigoAba">

      <div class="section">
        <h3>Dados do Cliente</h3>

        <div class="inline-grid">
          <div>
            <label>Nome</label>
            <input type="text" id="nome" name="nome" required>
          </div>

          <div>
            <label>E-mail</label>
            <input type="email" id="email" name="email">
          </div>

          <div>
            <label>Telefone</label>
            <input type="text" id="telefone" name="telefone">
          </div>

          <div>
            <label>Pessoas</label>
            <input type="number" id="pessoas" name="pessoas" min="1">
          </div>
        </div>
      </div>

      <div class="section">
        <h3>Detalhes</h3>

        <div class="inline-grid">
          <div>
            <label>Mesa</label>
            <select id="mesa" name="mesa">
              <option>SALA VIP</option>
              <option>SALA VIP 2</option>
              <option>SACADA</option>
              <option>SALÃO CENTRAL</option>
            </select>
          </div>

          <div>
            <label>Cardápio</label>
            <select id="cardapio" name="cardapio">
              <option>Buffet Ouro</option>
              <option>Buffet Diamante</option>
              <option>Master Gold</option>
            </select>
          </div>
        </div>

        <label>Data e Hora</label>
        <input type="datetime-local" id="datahora" name="datahora">
      </div>

      <div class="section">
        <h3>Pagamento</h3>

        <div class="inline-3">
          <div>
            <label>Valor Estimado</label>
            <input id="valorEstimado" name="valorEstimado">
          </div>
          <div>
            <label>Antecipado</label>
            <input id="pagamentoAntecipado" name="pagamentoAntecipado">
          </div>
          <div>
            <label>Banco</label>
            <select id="banco" name="banco">
              <option>SICREDI</option>
              <option>ITAÚ</option>
              <option>POS Crédito</option>
              <option>POS Débito</option>
            </select>
          </div>
        </div>
      </div>

      <div style="padding:18px;display:flex;justify-content:flex-end;gap:12px;">
        <button type="reset" class="btn btn-ghost">Limpar</button>
        <button type="submit" class="btn btn-primary">Salvar Reserva</button>
      </div>
    </form>

    <div class="card" style="margin-top:20px;">
      <div class="card-head">
        <h2>Calendário</h2>
      </div>

      <div class="cal">
        <div class="cal-head">
          <div class="cal-title" id="calTitle">–</div>
        </div>

        <div class="cal-grid" id="calDow"></div>
        <div class="cal-grid" id="calGrid"></div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL DIA -->
<div class="modal" id="dayModal">
  <div class="sheet">
    <h3 id="modalTitle" style="padding:18px;">Reservas do Dia</h3>
    <div id="modalList" style="padding:18px;"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
/* ---------------------------------------------------
   CONFIGURAR SEU ENDPOINT
--------------------------------------------------- */
const endpoint = "https://script.google.com/macros/s/AKfycbzmr9-pEwsov_brPZygjWHEUlYDPnPRr2W1Ld6ro41EHeiZg0yNeKrsNQWAttHW-HFoIQ/exec";

/* ---------------------------------------------------
   UTILITÁRIOS
--------------------------------------------------- */
const $ = (s, el=document)=> el.querySelector(s);
const $$ = (s, el=document)=> [...el.querySelectorAll(s)];

const toast = msg=>{
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),3000);
};

/* ---------------------------------------------------
   AUTENTICAÇÃO
--------------------------------------------------- */
$("#tabLogin").onclick = ()=>{
  $("#tabLogin").classList.add("active");
  $("#tabCadastro").classList.remove("active");
  $("#loginForm").style.display="block";
  $("#cadastroForm").style.display="none";
};

$("#tabCadastro").onclick = ()=>{
  $("#tabCadastro").classList.add("active");
  $("#tabLogin").classList.remove("active");
  $("#loginForm").style.display="none";
  $("#cadastroForm").style.display="block";
};

$("#btnLogin").onclick = async ()=>{
  const usuario = $("#loginUsuario").value;
  const senha = $("#loginSenha").value;

  const r = await fetch(endpoint,{
    method:"POST",
    body:JSON.stringify({action:"login",usuario,senha})
  }).then(r=>r.json());

  if(!r.ok) return toast("Usuário ou senha inválidos.");

  localStorage.setItem("USER",JSON.stringify(r));
  $("#authBox").style.display="none";
  $("#app").style.display="block";
  $("#codigoAba").value = r.codigo;

  refreshCalendar();
};

$("#btnCadastrar").onclick = async ()=>{
  const nome = $("#cadNome").value;
  const email = $("#cadEmail").value;
  const usuario = $("#cadUsuario").value;
  const senha = $("#cadSenha").value;

  const r = await fetch(endpoint,{
    method:"POST",
    body:JSON.stringify({action:"criarUsuario",nome,email,usuario,senha})
  }).then(r=>r.json());

  if(!r.ok) return toast(r.message);

  toast("Usuário criado!");
  $("#tabLogin").click();
};

/* ---------------------------------------------------
   FORM RESERVA
--------------------------------------------------- */

$("#reservaForm").onsubmit = async e=>{
  e.preventDefault();

  const payload = Object.fromEntries(new FormData(reservaForm).entries());

  const r = await fetch(endpoint,{
    method:"POST",
    body:new URLSearchParams(payload)
  }).then(r=>r.text());

  toast("Reserva salva!");
  e.target.reset();
  refreshCalendar();
};

/* ---------------------------------------------------
   CALENDÁRIO
--------------------------------------------------- */
const dowShort = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
$("#calDow").innerHTML = dowShort.map(d=>`<div class="cal-dow">${d}</div>`).join("");

async function refreshCalendar(){
  const user = JSON.parse(localStorage.getItem("USER"));
  if(!user) return;

  const now = new Date();
  const ano = now.getFullYear();
  const mes = now.getMonth()+1;

  const url = `${endpoint}?acao=listar&ano=${ano}&mes=${mes}&codigoAba=${user.codigo}`;
  const data = await fetch(url).then(r=>r.json());

  $("#calTitle").textContent = now.toLocaleString("pt-BR",{month:"long",year:"numeric"});

  const first = new Date(ano, mes-1, 1);
  const start = new Date(first);
  const startDay = first.getDay();
  start.setDate(1 - startDay);

  const html = [];

  for(let i=0;i<42;i++){
    const d = new Date(start);
    d.setDate(start.getDate()+i);

    const dateISO = d.toISOString().slice(0,10);
    const items = data.filter(r => r.datahora && r.datahora.startsWith(dateISO));

    let tags = "";
    if(items.length) tags = `<span class="tag">${items.length} reservas</span>`;

    html.push(`
      <div class="cal-day" data-date="${dateISO}">
        <div class="num">${d.getDate()}</div>
        <div class="tags">${tags}</div>
      </div>
    `);
  }

  $("#calGrid").innerHTML = html.join("");

  $$("#calGrid .cal-day").forEach(btn=>{
    btn.onclick = ()=> openDayModal(btn.dataset.date,data);
  });
}

function openDayModal(date, items){
  const list = items.filter(r => r.datahora && r.datahora.startsWith(date));
  $("#modalTitle").textContent = "Reservas de " + date.split("-").reverse().join("/");

  $("#modalList").innerHTML = !list.length
    ? "<p>Nenhuma reserva.</p>"
    : list.map(r=>`
      <div class="res-item">
        <div class="name">${r.nome}</div>
        <div>${r.mesa} — ${r.pessoas} pessoas</div>
        <div>${r.telefone}</div>
      </div>`).join("");

  $("#dayModal").classList.add("show");
}

$("#dayModal").onclick = e=>{
  if(e.target===dayModal) dayModal.classList.remove("show");
};

/* AUTO LOGIN */
window.onload = ()=>{
  const u = localStorage.getItem("USER");
  if(u){
    $("#authBox").style.display="none";
    $("#app").style.display="block";
    const user = JSON.parse(u);
    $("#codigoAba").value = user.codigo;
    refreshCalendar();
  }
};
</script>
</body>
</html>
